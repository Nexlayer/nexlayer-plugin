# ============================================================================
# FULLSTACK TEMPLATE - Frontend + API + Database
# ============================================================================
# Use Case: Full-stack web applications
# Complexity: Intermediate
# Pods: 3 (frontend, api, postgres)
# ============================================================================
#
#   User Browser
#        │
#        ▼
#   ┌──────────┐     ┌─────────┐     ┌──────────┐
#   │ frontend │ ──▶ │   api   │ ──▶ │ postgres │
#   │  path:/  │     │path:/api│     │ internal │
#   └──────────┘     └─────────┘     └──────────┘
#        │                │                │
#        │                │                │
#   <% URL %>      <% URL %>/api    postgres.pod:5432
#   (browser)        (browser)        (server only)
#
# ============================================================================

application:
  name: fullstack-app
  pods:
    # ─────────────────────────────────────────────────────────────────────────
    # FRONTEND - Browser-facing React/Next.js/Vue app
    # ─────────────────────────────────────────────────────────────────────────
    - name: frontend
      image: registry.nexlayer.io/fullstack-app/frontend:latest
      path: /
      servicePorts: [3000]
      vars:
        # Browser variables MUST use <% URL %> (public URL)
        NEXT_PUBLIC_API_URL: <% URL %>/api
        # REACT_APP_API_URL: <% URL %>/api   # For Create React App
        # VITE_API_URL: <% URL %>/api        # For Vite

    # ─────────────────────────────────────────────────────────────────────────
    # API - Backend service
    # ─────────────────────────────────────────────────────────────────────────
    - name: api
      image: registry.nexlayer.io/fullstack-app/api:latest
      path: /api
      servicePorts: [8080]
      vars:
        NODE_ENV: production
        # Server variables use .pod DNS (internal)
        DATABASE_URL: postgresql://postgres:postgres@postgres.pod:5432/app
        # CORS - allow frontend origin
        CORS_ORIGIN: <% URL %>

    # ─────────────────────────────────────────────────────────────────────────
    # POSTGRESQL - Database (no path = internal only)
    # ─────────────────────────────────────────────────────────────────────────
    - name: postgres
      image: postgres:16-alpine
      servicePorts: [5432]
      vars:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres  # Change in production!
        POSTGRES_DB: app
      volumes:
        - name: pg-data
          size: 10Gi
          mountPath: /var/lib/postgresql  # NOT /var/lib/postgresql/data!
