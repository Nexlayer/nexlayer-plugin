# ============================================================================
# PYTHON API TEMPLATE - FastAPI/Flask/Django
# ============================================================================
# Use Case: Python backend with PostgreSQL and Redis
# Complexity: Intermediate
# Pods: 3 (api, postgres, redis)
# ============================================================================
#
#   User/Client
#        │
#        ▼
#   ┌─────────┐
#   │   api   │ ← FastAPI/Flask/Django
#   │ path:/  │
#   └─────────┘
#        │
#   ┌────┴────┐
#   ▼         ▼
# postgres  redis
#
# ============================================================================

application:
  name: python-api
  pods:
    # ─────────────────────────────────────────────────────────────────────────
    # PYTHON API - FastAPI, Flask, or Django
    # ─────────────────────────────────────────────────────────────────────────
    - name: api
      image: registry.nexlayer.io/python-api/api:latest
      path: /
      servicePorts: [8000]  # FastAPI/uvicorn default
      vars:
        # Environment
        ENVIRONMENT: production
        DEBUG: "false"

        # Database (server-side, use .pod)
        DATABASE_URL: postgresql://postgres:postgres@postgres.pod:5432/app

        # Redis (server-side, use .pod)
        REDIS_URL: redis://redis.pod:6379

        # CORS origins (if needed)
        ALLOWED_ORIGINS: "*"

    # ─────────────────────────────────────────────────────────────────────────
    # POSTGRESQL
    # ─────────────────────────────────────────────────────────────────────────
    - name: postgres
      image: postgres:16-alpine
      servicePorts: [5432]
      vars:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: app
      volumes:
        - name: pg-data
          size: 10Gi
          mountPath: /var/lib/postgresql

    # ─────────────────────────────────────────────────────────────────────────
    # REDIS - Cache and session store
    # ─────────────────────────────────────────────────────────────────────────
    - name: redis
      image: redis:7-alpine
      servicePorts: [6379]
