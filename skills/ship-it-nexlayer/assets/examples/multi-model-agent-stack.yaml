# ============================================================================
# MULTI-MODEL AGENT STACK - AI Agent Orchestration (22% YC Adoption)
# ============================================================================
# Next.js + FastAPI + LangChain + Multiple LLMs + Redis + PostgreSQL
#
# WHAT IS THIS?
#   Modern AI agents use multiple models for different tasks:
#   - GPT-4 for complex reasoning
#   - Claude for safety-critical tasks
#   - Gemini for multimodal (images)
#   - Local LLM for high-volume, low-cost tasks
#
# WHY MULTI-MODEL?
#   - Cost optimization (right model for each task)
#   - Capability matching (some models better at certain tasks)
#   - Fallback/redundancy (if one API is down)
#   - Avoiding vendor lock-in
#
# ADOPTION: 16% multi-model, 22% agent stack pattern among YC companies
#
# USE CASES:
#   - Autonomous AI agents (HumanLayer, Codebuff style)
#   - Complex workflows with multiple AI steps
#   - Code generation + review pipelines
#   - Document processing with fallbacks
#
# ============================================================================
# ARCHITECTURE
# ============================================================================
#
#   ┌─────────────────────────────────────────────────────────────────────┐
#   │                    Next.js Frontend                                 │
#   │                 Agent UI + Streaming Chat                           │
#   └───────────────────────────┬─────────────────────────────────────────┘
#                               │
#                               ▼
#   ┌─────────────────────────────────────────────────────────────────────┐
#   │                FastAPI + LangChain Orchestration                    │
#   │                                                                     │
#   │  ┌─────────────┐  ┌─────────────┐  ┌─────────────┐  ┌───────────┐  │
#   │  │   Router    │──│   Chains    │──│   Agents    │──│   Tools   │  │
#   │  │  (Model     │  │ (Prompts +  │  │  (ReAct,    │  │ (Search,  │  │
#   │  │  Selection) │  │   Memory)   │  │   Plan+Ex)  │  │   Code)   │  │
#   │  └─────────────┘  └─────────────┘  └─────────────┘  └───────────┘  │
#   └──────────┬────────────────┬────────────────┬────────────────┬──────┘
#              │                │                │                │
#              ▼                ▼                ▼                ▼
#   ┌──────────────┐  ┌──────────────┐  ┌──────────────┐  ┌──────────────┐
#   │   OpenAI     │  │   Anthropic  │  │   Google     │  │   Ollama     │
#   │   GPT-4      │  │   Claude 3   │  │   Gemini     │  │   LLaMA 3    │
#   │              │  │              │  │              │  │   (Local)    │
#   │  Complex     │  │  Safety      │  │  Multimodal  │  │  High-volume │
#   │  reasoning   │  │  critical    │  │  (images)    │  │  low-cost    │
#   └──────────────┘  └──────────────┘  └──────────────┘  └──────────────┘
#
# ============================================================================
# MODEL ROUTING STRATEGY
# ============================================================================
#
# | Task Type          | Primary Model    | Fallback        | Why                |
# |--------------------|------------------|-----------------|-------------------|
# | Complex reasoning  | GPT-4 Turbo      | Claude 3 Opus   | Best at logic     |
# | Code generation    | GPT-4 / Claude   | DeepSeek Coder  | Safety + quality  |
# | Safety-critical    | Claude 3         | GPT-4           | Constitutional AI |
# | Image analysis     | Gemini Pro       | GPT-4 Vision    | Multimodal native |
# | High-volume chat   | LLaMA 3 (local)  | GPT-3.5         | Cost savings      |
# | Embeddings         | text-embed-3-sm  | local embed     | Quality + cost    |
#
# ============================================================================

application:
  name: multi-model-agent

  pods:
    # =========================================================================
    # NEXT.JS FRONTEND (Agent UI)
    # =========================================================================
    - name: nextjs
      image: your-org/agent-frontend:latest
      path: /
      servicePorts: [3000]

      vars:
        NEXT_PUBLIC_API_URL: <% URL %>/api
        NEXT_PUBLIC_WS_URL: <% URL %>
        # WebSocket for real-time agent updates

    # =========================================================================
    # FASTAPI + LANGCHAIN ORCHESTRATION
    # =========================================================================
    - name: fastapi
      image: your-org/agent-backend:latest
      path: /api
      servicePorts: [8000]

      vars:
        # -------------------------------------------------------------------
        # Multi-Model API Keys
        # -------------------------------------------------------------------
        OPENAI_API_KEY: ${OPENAI_API_KEY}
        ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
        GOOGLE_API_KEY: ${GOOGLE_API_KEY}
        # All three major providers for model routing

        # -------------------------------------------------------------------
        # Local LLM (Ollama)
        # -------------------------------------------------------------------
        OLLAMA_BASE_URL: http://ollama.pod:11434
        # For high-volume, low-cost tasks

        # -------------------------------------------------------------------
        # Model Selection Defaults
        # -------------------------------------------------------------------
        DEFAULT_CHAT_MODEL: gpt-4-turbo-preview
        DEFAULT_FAST_MODEL: gpt-3.5-turbo
        DEFAULT_EMBEDDING_MODEL: text-embedding-3-small
        DEFAULT_LOCAL_MODEL: llama3:8b

        # -------------------------------------------------------------------
        # Database + Cache
        # -------------------------------------------------------------------
        DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@postgres.pod:5432/agents
        REDIS_URL: redis://redis.pod:6379/0

        # -------------------------------------------------------------------
        # LangChain / LangSmith
        # -------------------------------------------------------------------
        LANGCHAIN_TRACING_V2: "true"
        LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY}
        LANGCHAIN_PROJECT: multi-model-agent

        # -------------------------------------------------------------------
        # Vector Database
        # -------------------------------------------------------------------
        QDRANT_HOST: qdrant.pod
        QDRANT_PORT: "6333"

    # =========================================================================
    # AGENT WORKER (Background Tasks)
    # =========================================================================
    - name: worker
      image: your-org/agent-backend:latest
      command: celery -A app.worker worker -Q agents,tools --loglevel=info
      servicePorts: [8001]

      vars:
        OPENAI_API_KEY: ${OPENAI_API_KEY}
        ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
        GOOGLE_API_KEY: ${GOOGLE_API_KEY}
        OLLAMA_BASE_URL: http://ollama.pod:11434
        DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@postgres.pod:5432/agents
        REDIS_URL: redis://redis.pod:6379/0
        QDRANT_HOST: qdrant.pod
        QDRANT_PORT: "6333"

    # =========================================================================
    # OLLAMA (Local LLM)
    # =========================================================================
    - name: ollama
      image: ollama/ollama:latest
      servicePorts: [11434]

      command: >-
        sh -c "ollama serve &
        sleep 5 &&
        ollama pull llama3:8b &&
        wait"

      volumes:
        - name: ollama-models
          size: 20Gi
          mountPath: /root/.ollama

    # =========================================================================
    # QDRANT (Vector Database)
    # =========================================================================
    - name: qdrant
      image: qdrant/qdrant:v1.7.4
      servicePorts: [6333, 6334]

      volumes:
        - name: qdrant-storage
          size: 10Gi
          mountPath: /qdrant/storage

    # =========================================================================
    # POSTGRESQL (Agent State + Memory)
    # =========================================================================
    - name: postgres
      image: postgres:16-alpine
      servicePorts: [5432]

      vars:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: ${DB_PASSWORD}
        POSTGRES_DB: agents
        PGDATA: /var/lib/postgresql/data/pgdata

      volumes:
        - name: postgres-data
          size: 10Gi
          mountPath: /var/lib/postgresql/data

    # =========================================================================
    # REDIS (Agent Memory + Task Queue)
    # =========================================================================
    - name: redis
      image: redis:7-alpine
      command: redis-server --appendonly yes
      servicePorts: [6379]

      volumes:
        - name: redis-data
          size: 2Gi
          mountPath: /data

