# =============================================================================
# COST SAVINGS CALCULATION
# =============================================================================
#
# Assuming 1M tokens/month (typical for small SaaS):
#
# | Provider        | Cost/1M tokens | Monthly Cost |
# |-----------------|----------------|--------------|
# | GPT-4 Turbo     | $30 input/$60 out | ~$45      |
# | Claude 3 Opus   | $15 input/$75 out | ~$45      |
# | GPT-3.5 Turbo   | $0.50/$1.50    | ~$1          |
# | Self-hosted     | $0 (compute only)| ~$0        |
#
# At 10M tokens/month, savings = $450/month = $5,400/year
#
# Trade-off: Self-hosted requires more DevOps and has lower quality
