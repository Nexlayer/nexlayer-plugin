name: validate

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow only inspects the tree. Fork PRs run untrusted
# code (validate.py comes from the PR), so it must never be able to write.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python3 scripts/validate.py
      - run: python3 scripts/gen-host-components.py --check
